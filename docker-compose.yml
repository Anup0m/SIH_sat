version: '3.8'

services:
  satquery-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satquery_workstation
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/reports:/app/data/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
